name: 🎭 Playwright E2E Tests - Complete Quality Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * *'   # Daily at 2 AM UTC
    - cron: '0 3 * * 0'   # Weekly security scan: Sunday at 3 AM UTC
    - cron: '0 4 1-7 * 0' # Monthly load test: 1st Sunday 4 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      browser:
        description: 'Browser to test'
        required: false
        default: 'all'
        type: choice
        options: [all, chromium, firefox, webkit]
      security_scan:
        description: 'Run comprehensive security scan'
        required: false
        default: false
        type: boolean
      load_test:
        description: 'Run load testing'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  FORCE_COLOR: 1
  CI: true

jobs:
  # 🔍 Code Quality
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint . --ext .ts,.js,.tsx,.jsx --max-warnings 10
      - name: Prettier
        run: npx prettier --check .
      - name: TypeScript
        run: npx tsc --noEmit
        if: ${{ hashFiles('tsconfig.json') != '' }}

  # 🛡️ Security Audit
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: NPM Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # 🧪 Playwright E2E (all browsers)
  test:
    name: 🧪 Core Tests (${{ matrix.browser }})
    needs: [code-quality, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --reporter=blob,junit
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL || 'https://staging.example.com' }}
      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.browser }}-${{ github.run_id }}
          path: blob-report
          retention-days: 30

  # ♿ Accessibility Tests
  accessibility:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run a11y tests
        run: npx playwright test --grep="@accessibility|a11y" --project=chromium --reporter=junit
        continue-on-error: true

  # 🔐 ZAP Security Scan (main only)
  security-zap:
    name: 🔐 ZAP Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create ZAP rules
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv << 'EOF'
          10010   IGNORE  (Cookie No HttpOnly Flag)
          10011   IGNORE  (Cookie Without Secure Flag)
          90020   IGNORE  (Missing Anti-clickjacking Header)
          EOF
      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ github.token }}
          target: ${{ secrets.STAGING_BASE_URL || 'https://katalon-test.s3.amazonaws.com/aut/html/form.html' }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false
          allow_issue_writing: false
      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: zap-security-reports-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30

  # 🖼️ Visual Regression (PRs only)
  visual-regression:
    name: 🖼️ Visual Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run visual regression tests
        run: npx playwright test --grep="@visual|visual" --project=chromium --reporter=junit
        continue-on-error: true

  # ⚡ Performance (Lighthouse, scheduled)
  performance:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Create Lighthouse config
        run: |
          cat > .lighthouserc.js << 'EOF'
          module.exports = {
            ci: {
              collect: {
                url: [process.env.BASE_URL || 'https://example.com'],
                numberOfRuns: 3,
              },
              upload: {
                target: 'temporary-public-storage',
              },
            },
          };
          EOF
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # 🔬 SonarQube (fixed action syntax)
  sonarqube:
    name: 🔬 SonarQube Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage || npm test -- --coverage || echo "No coverage script configured"
        continue-on-error: true
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=src,tests
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # 📈 Load Testing (scheduled/monthly)
  load-testing:
    name: 📈 Load Testing
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 4 1-7 * 0' || github.event.inputs.load_test == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install K6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Basic load test
        run: |
          TARGET_URL="${{ secrets.STAGING_BASE_URL || 'https://example.com' }}"
          echo "import http from 'k6/http'; import { check } from 'k6'; export let options = { vus: 10, duration: '2m' }; export default function () { let res = http.get(TARGET_URL); check(res, { 'status was 200': (r) => r.status == 200 }); }" > basic-load.js
          k6 run --env TARGET_URL=$TARGET_URL basic-load.js

  # 🤖 CodeRabbit (PRs only)
  coderabbit:
    name: 🤖 CodeRabbit AI Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CodeRabbit Analysis
        uses: coderabbitai/coderabbit-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true

  # 🔐 Weekly Comprehensive Security Scan (scheduled/dispatch)
  security-comprehensive-weekly:
    name: 🔐 Weekly Comprehensive Security
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * 0' || github.event.inputs.security_scan == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install security tools
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          sudo apt-get update
          sudo apt-get install -y nikto nmap
      - name: Cache Nuclei templates
        uses: actions/cache@v4
        with:
          path: ~/nuclei-templates
          key: nuclei-templates-weekly-${{ runner.os }}-v10.2.7
      - name: Update Nuclei templates
        run: $HOME/go/bin/nuclei -update-templates -silent
      - name: Comprehensive Security Scan
        run: |
          TARGET_URL="${{ secrets.STAGING_BASE_URL || 'https://katalon-test.s3.amazonaws.com' }}"
          DOMAIN=$(echo "$TARGET_URL" | sed 's|https\\?://||' | sed 's|/.*||')
          timeout 10m $HOME/go/bin/nuclei -u "$TARGET_URL" -severity high,critical -j -o nuclei-weekly.json -silent || true
          timeout 6m nikto -h "$TARGET_URL" -Format txt -output nikto-weekly.txt || true
          timeout 4m nmap -sV --script vuln "$DOMAIN" -oN nmap-weekly.txt || true

  # 📊 Merge/Publish HTML reports
  merge-reports:
    name: 📊 Merge Reports
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: 'blob-report-*'
          path: all-blob-reports
          merge-multiple: true
      - name: Merge HTML reports
        run: |
          if [ -d "all-blob-reports" ] && [ "$(find all-blob-reports -name "*.zip" | wc -l)" -gt 0 ]; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            mkdir -p playwright-report
            echo "<html><body><h1>No reports to merge</h1></body></html>" > playwright-report/index.html
          fi
      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: combined-html-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: test-reports/${{ github.run_id }}

  # 📧 Notification on failure
  notify-failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, accessibility, security-headers-daily, security-zap]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Email notification
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Quality Pipeline Failed - ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "Quality Pipeline <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            Quality pipeline failed on ${{ github.ref }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Failed Components:
              - Code Quality: ${{ needs.code-quality.result }}
              - Tests: ${{ needs.test.result }}
              - Accessibility: ${{ needs.accessibility.result }}
              - Security: ${{ needs.security-headers-daily.result }}
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
