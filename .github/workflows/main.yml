name: 🎭 Playwright E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      browser:
        description: 'Browser to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

env:
  NODE_VERSION: '20'
  FORCE_COLOR: 1
  CI: true

jobs:
  test:
    name: Test on ${{ matrix.os }} - ${{ matrix.browser }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        browser: [chromium, firefox, webkit]
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT

      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '' }}
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-
            ${{ runner.os }}-playwright-

      - name: 🎭 Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: 🎭 Install Playwright system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'

      - name: 🔧 Setup test environment
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ secrets.PROD_BASE_URL || 'https://example.com' }}" >> $GITHUB_ENV
          else
            echo "BASE_URL=${{ secrets.STAGING_BASE_URL || 'https://staging.example.com' }}" >> $GITHUB_ENV
          fi
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL || 'test@example.com' }}" >> $GITHUB_ENV
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD || 'password123' }}" >> $GITHUB_ENV
        shell: bash

      - name: 🧪 Run Playwright tests
        run: |
          if [ "${{ github.event.inputs.browser }}" = "all" ] || [ -z "${{ github.event.inputs.browser }}" ]; then
            npx playwright test --project=${{ matrix.browser }}
          else
            npx playwright test --project=${{ github.event.inputs.browser }}
          fi
        shell: bash

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/**/test-failed-*.png
          retention-days: 7

      - name: 🎥 Upload videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: videos-${{ matrix.os }}-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/**/*.webm
          retention-days: 7

  lighthouse:
    name: 🔍 Lighthouse Performance Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

  visual-regression:
    name: 🖼️ Visual Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: 🖼️ Run visual regression tests
        run: npx playwright test --grep="visual" --project=chromium
        continue-on-error: true

      - name: 📊 Upload visual diff
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-regression-diff-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  api-tests:
    name: 🔗 API Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔗 Run API tests
        run: |
          if [ -d "tests/api" ]; then
            npx playwright test tests/api/
          else
            echo "No API tests directory found - skipping"
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}

      - name: 📊 Upload API test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-test-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  mobile-tests:
    name: 📱 Mobile Device Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.environment == 'production'
    
    strategy:
      matrix:
        device: ['iPhone 13', 'Pixel 5', 'iPad Air']
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium webkit --with-deps

      - name: 📱 Run mobile tests
        run: |
          # Convert device name to project name (spaces to hyphens, etc.)
          DEVICE_PROJECT=$(echo "${{ matrix.device }}" | tr ' ' '-' | tr '[:upper:]' '[:lower:]')
          if npx playwright test --list | grep -q "$DEVICE_PROJECT"; then
            npx playwright test --project="$DEVICE_PROJECT"
          else
            echo "Project $DEVICE_PROJECT not found, running with device emulation"
            npx playwright test --grep="mobile"
          fi

      - name: 📊 Upload mobile test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobile-test-results-${{ matrix.device }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 15

  accessibility:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: ♿ Run accessibility tests
        run: |
          if [ -d "tests/accessibility" ]; then
            npx playwright test tests/accessibility/
          else
            echo "No accessibility tests directory found - skipping"
          fi

      - name: 📊 Upload accessibility results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: accessibility-test-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  security:
    name: 🔐 Security Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Create ZAP rules file
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv << 'EOF'
          10010	IGNORE	(Cookie No HttpOnly Flag)
          10011	IGNORE	(Cookie Without Secure Flag)
          90020	IGNORE	(Missing Anti-clickjacking Header)
          EOF

      - name: 🔐 Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.STAGING_BASE_URL || 'https://staging.example.com' }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false

      - name: 📊 Upload ZAP results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: zap-baseline-report-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30

  report:
    name: 📊 Generate Combined Report
    runs-on: ubuntu-latest
    needs: [test, api-tests]
    if: ${{ !cancelled() }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📚 Install Playwright for report generation
        run: npm install @playwright/test

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          merge-multiple: true
          path: ./all-blob-reports

      - name: 📊 Merge HTML reports
        run: |
          if [ -d "./all-blob-reports" ] && [ "$(ls -A ./all-blob-reports)" ]; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "No reports to merge"
            mkdir -p playwright-report
            echo "<html><body><h1>No test reports generated</h1></body></html>" > playwright-report/index.html
          fi

      - name: 📊 Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: combined-html-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: 📊 Publish HTML Report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: test-reports/${{ github.run_id }}

  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [test, api-tests, mobile-tests, accessibility, security]
    if: failure() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
    
    steps:
      - name: 📧 Send email notification
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Playwright Tests Failed - ${{ github.repository }}"
          body: |
            The Playwright test suite has failed on ${{ github.ref }}.
            
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            Please check the GitHub Actions logs for more details.
            
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"

      - name: 💬 Slack notification
        uses: 8398a7/action-slack@v3
        continue-on-error: true
        with:
          status: failure
          channel: '#qa-alerts'
          text: |
            🚨 Playwright tests failed!
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup:
    name: 🧹 Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [report]
    if: always()
    
    steps:
      - name: 🧹 Delete old artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            screenshots-*
            videos-*
          failOnError: false
          useGlob: true